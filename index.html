<style>
:root{
  --bg:#f5efe4; --paper:#fffdf8; --ink:#33302b; --sub:#7a7264;
  --line:#e4dccb; --brand:#9a3b2e; --brand2:#c2603f; --gold:#b8893b;
  --ok:#2f7d52; --okbg:#e7f4ec; --bad:#b23a36; --badbg:#fbe9e7;
  --yin:#1d6fae; --yinsoft:#5b97c0; --hl:#b8400f; --cur:#a7782a;
  --shadow:0 2px 10px rgba(80,60,30,.08);
  --kai:"DFKai-SB","BiauKai","Kaiti TC","KaiTi","STKaiti",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;line-height:1.7;font-size:17px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#fbf6ec,#f5efe4);border-bottom:1px solid var(--line);padding:10px 14px 8px;backdrop-filter:saturate(1.2) blur(4px)}
.htitle{display:flex;align-items:baseline;gap:8px;max-width:820px;margin:0 auto}
.htitle b{font-size:20px;color:var(--brand);letter-spacing:1px}
.htitle span{font-size:12.5px;color:var(--sub)}
.ctrls{max-width:820px;margin:8px auto 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit}
.tabs{display:flex;gap:6px;max-width:820px;margin:8px auto 0;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;font-size:15px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--sub);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
h2.les{font-size:16px;color:var(--brand);margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--gold);display:flex;align-items:center;gap:8px}
h2.les small{color:var(--sub);font-weight:400;font-size:12px}
.cat{font-size:13.5px;color:#fff;background:var(--brand2);display:inline-block;padding:2px 10px;border-radius:999px;margin:14px 0 6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px 12px;margin:8px 0}
.grphint{font-size:12.5px;color:var(--sub);padding:0 8px 4px}
.grphint b{color:var(--gold);font-family:var(--kai);font-size:16px}

/* ===== 注音直堆 (ported from 字音字形 App) ===== */
.ruby{display:inline-flex;align-items:stretch}
.ruby .rb{font-family:var(--kai);font-weight:700;color:var(--ink);line-height:1;display:flex;align-items:center}
.zn{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;margin-left:2px;padding-right:.72em}
.zsym{color:var(--yin);font-weight:600;line-height:1.02}
.zt{position:absolute;color:var(--yin);font-weight:700;line-height:1}
.zt-r{right:0;top:50%;transform:translateY(-50%)}
.zt-t{left:50%;top:-2px;transform:translateX(-50%)}

/* ===== 直書瀏覽：形近字並列直行 ===== */
.xcols{display:flex;flex-direction:row;justify-content:flex-start;gap:0;overflow-x:auto;padding:6px 2px 8px}
.xcol{flex:0 0 auto;min-width:80px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:6px 12px;border-left:1px dashed var(--line)}
.xcol:first-child{border-left:0}
.xhead{display:flex;align-items:flex-start}
.xhead .rb{font-size:46px}
.xcol.cur .xhead .rb{color:var(--brand)}
.xhead .zsym{font-size:16px}.xhead .zt{font-size:15px}
.curbadge{font-size:10px;color:#fff;background:var(--cur);padding:1px 6px;border-radius:6px;margin-top:2px}
.xbody{display:flex;flex-direction:row;justify-content:flex-start;gap:10px;margin-top:2px}
.vline{writing-mode:vertical-rl;text-orientation:upright;-webkit-text-orientation:upright;
  font-family:var(--kai);font-size:16.5px;line-height:1.55;color:#4a463e;letter-spacing:1px;
  height:max-content;align-self:flex-start}
.vline.note{color:var(--sub);font-size:19px;letter-spacing:0}
.vline.note .nhead{visibility:hidden;font-size:16.5px;letter-spacing:1px}

/* ===== 會考攻略：橫式表格 ===== */
.gcard{padding:8px}
.gtbl{width:100%;border-collapse:collapse;font-family:var(--kai);font-size:17px;line-height:1.65;color:var(--ink)}
.gtbl th{background:#efe6d6;color:var(--brand);font-weight:700;font-size:15px;padding:5px 6px;border:1px solid var(--line)}
.gtbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
.gtbl .no{text-align:center;width:2.2em;color:var(--sub);font-family:inherit}
.gtbl .ch{text-align:center;width:2.6em;font-size:22px;font-weight:700;white-space:nowrap}
.gtbl .ch .st{color:var(--bad);font-size:12px;vertical-align:.5em;margin-right:1px}
.gtbl .yn{text-align:center;width:2.4em}
.gtbl .yn .zn{display:inline-flex;margin:0}
.gtbl .yn .zsym{font-size:15px}.gtbl .yn .zt{font-size:14px}
.gtbl .mn{color:#5a5347;width:32%}
.gtbl .hl{color:var(--hl);font-weight:800}
.gtbl tbody.grp+tbody.grp tr:first-child td{border-top:4px solid var(--brand2)}
.gtbl .gtip td{background:#fbf4e3;font-size:14.5px;color:#6b5a3a}
.fn{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.3em;border-radius:999px;background:#3b3833;color:#fff;font:700 10.5px/1 system-ui,sans-serif;margin:0 3px 0 2px;padding:0 3px;vertical-align:.18em}
.gnotes{font-size:15px;color:#5a5347;background:#f3efe6;border-radius:10px;padding:8px 12px;margin-top:8px;line-height:1.75}
.gnotes .fn{margin-left:0}
@media(max-width:560px){.gcard{padding:6px 4px}.gtbl{font-size:15.5px;line-height:1.55}.gtbl td{padding:5px 5px}.gtbl th{font-size:13.5px;padding:4px 3px}
  .gtbl .ch{font-size:19px;width:2.1em}.gtbl .no{width:1.8em}.gtbl .mn{width:auto;font-size:14px}.gnotes{font-size:14px}}
.vline .hl{color:var(--hl);font-weight:800;font-size:1.12em}
.vline .pos{color:var(--gold);font-size:.82em}
.vline .yin{color:var(--yinsoft);font-size:.82em}

/* ===== quiz ===== */
.qbox{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-top:14px}
.qmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:10px}
.qstage{display:flex;justify-content:center;padding:10px 0 4px}
.qprompt{font-family:var(--kai);font-size:25px;line-height:1.95;color:var(--ink);text-align:center;max-width:620px}
.qprompt .hl{color:var(--hl);font-weight:800;font-size:1.1em}
.qprompt .pos{color:var(--gold);font-size:.72em}
.hblank{display:inline-block;min-width:1.3em;border-bottom:3px solid var(--brand);color:transparent;margin:0 4px}
.yinh{font-size:23px;color:var(--yin);font-weight:600;letter-spacing:2px}
.qlen{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin-bottom:12px}
.lenbtn{font-size:13px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;color:var(--sub);font-family:inherit}
.lenbtn.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
.qhint{font-size:14px;color:var(--sub);text-align:center;margin:10px 0 4px}
.qhint b{color:var(--brand);font-family:var(--kai);font-size:20px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:10px}
.opt{padding:12px 8px;border:2px solid var(--line);border-radius:12px;background:#fffef9;cursor:pointer;
  display:flex;justify-content:center;align-items:center;min-height:74px;transition:.12s}
.opt .rb{font-size:34px;font-family:var(--kai);font-weight:700;color:var(--ink)}
.opt.yinopt .zsym{font-size:18px}.opt.yinopt .zt{font-size:16px}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .rb,.opt.ok .zsym,.opt.ok .zt{color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .rb,.opt.bad .zsym,.opt.bad .zt{color:var(--bad)}
.opt.dim{opacity:.45}
.opts.kaoopts{grid-template-columns:1fr}
.opt.kaoopt{justify-content:flex-start;min-height:50px;padding:10px 14px;font-size:18px;line-height:1.6;text-align:left}
.opt.kaoopt .kl{color:var(--brand);font-weight:700;margin-right:8px;flex:0 0 auto}
.qprompt.kaoq{font-size:20px;text-align:left;line-height:1.8}
.fb{margin-top:14px;font-size:15px;padding:10px 12px;border-radius:10px;display:none;text-align:center}
.fb.show{display:block}.fb.good{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.fb .ex{color:#4a463e;margin-top:6px;font-size:14px;font-family:var(--kai)}
.fb .ex .hl{color:var(--hl);font-weight:800}
.next{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;box-shadow:var(--shadow)}
.score{display:flex;gap:14px;font-size:13.5px;color:var(--sub);margin-top:10px;justify-content:center}
.score b{color:var(--brand)}
/* 錯題本 */
.mtools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;color:var(--ink)}
.btn.danger{color:var(--bad);border-color:#e8c4c0}
.mround{margin:14px 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.mround h4{margin:0 0 6px;font-size:13.5px;color:var(--sub);font-weight:600}
.mitem{font-size:14.5px;padding:5px 0;border-top:1px dashed var(--line);font-family:var(--kai)}
.mitem:first-of-type{border-top:0}
.mitem .wrong{color:var(--bad)}.mitem .right{color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:15px}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:#eee5d3;color:var(--sub);margin-right:5px;font-family:inherit}
.acct{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.acct.acct-form{flex-direction:column;align-items:stretch}
.acct .atitle{font-weight:700;color:var(--brand);font-size:15px}
.acct input{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fffef9;font-family:inherit;width:100%}
.acct .abtns{display:flex;gap:8px;flex-wrap:wrap}
.btn.brand{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.amsg{font-size:13px;color:var(--sub);min-height:1em}.amsg.bad{color:var(--bad)}.amsg.ok{color:var(--ok)}
</style>
</head>

const $=s=>document.querySelector(s);
const app=$('#app'), volSel=$('#volSel'), lesSel=$('#lesSel'), catSel=$('#catSel');
let TAB='browse', VOL='ALL', LES='ALL', CAT='ALL';

/* ---------- 注音直堆 ---------- */
const TONE_R={'ˊ':1,'ˇ':1,'ˋ':1,'ˉ':1};
function vzhuyin(syl){syl=(syl||'').trim();if(!syl)return '';let base=syl,tone='',pos='';
  if(syl[0]==='˙'){tone='˙';pos='t';base=syl.slice(1);}
  else{const last=syl[syl.length-1];if(TONE_R[last]){tone=last;pos='r';base=syl.slice(0,-1);}}
  let h='<span class="zn">';for(const ch of base)h+=`<span class="zsym">${ch}</span>`;
  if(tone)h+=`<span class="zt zt-${pos}">${tone}</span>`;return h+'</span>';}
function ru(c,y){return `<span class="ruby"><span class="rb">${esc(c)}</span>${vzhuyin(y)}</span>`;}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* highlight 「」 + 詞性 + 行內注音, for a vertical line */
const ZHU=/[˙ㄅ-ㄯˇˊˋ]/;
function isZhu(c){return ZHU.test(c)}
function decorate(s){
  s=esc(s);
  s=s.replace(/「([^」]*)」/g,'「<span class="hl">$1</span>」');
  s=s.replace(/([〔［][^〕］]*[〕］])/g,'<span class="pos">$1</span>');
  s=s.replace(/([˙ㄅ-ㄯˇˊˋ]{2,})/g,'<span class="yin">$1</span>');
  return s;
}
function stripLead(s,ch){
  s=s.replace(/^[\s　]+/,'');
  if(ch && s.slice(0,ch.length)===ch) s=s.slice(ch.length);
  let i=0;while(i<s.length&&(/[\s　]/.test(s[i])||isZhu(s[i])))i++;
  return s.slice(i).replace(/^[\s　]+/,'').trim();
}
/* compact 詞例 clause: segment containing 「」 or （　） */
function clause(line){
  const parts=line.split(/[。；]/).map(x=>x.trim()).filter(Boolean);
  let seg=parts.filter(p=>/「|（\s*　?\s*）/.test(p)).pop()||parts.pop()||line;
  seg=seg.replace(/^[〔［][^〕］]*[〕］]\s*/,'').replace(/^[①-⑩\s　]+/,'').replace(/（本課）|\(本課\)/g,'');
  return seg.trim();
}

/* ---------- pools ---------- */
let FORM=[], YIN=[], ALLYIN=new Set();
function buildPools(){
  FORM=[];YIN=[];ALLYIN=new Set();
  DATA.forEach(v=>v.cats.forEach(c=>c.groups.forEach(g=>{
    const sibs=(g.chars&&g.chars.length>=2)?g.chars.slice():null;
    g.entries.forEach(e=>{
      (e.ex||[]).forEach(ex=>{
        if(ex.yin)ALLYIN.add(ex.yin);
        const single=ex.ans===e.char&&[...e.char].length===1;
        if(single&&sibs){
          const cl=clause(ex.sent);
          if(/（\s*　?\s*）/.test(cl))
            FORM.push({vol:v.vol,vid:v.id,les:v.title,cat:c.name,ans:e.char,opts:sibs,clause:cl,cur:ex.cur});
        }
        if(single&&ex.yin){
          const cl=clause(ex.raw);
          if(cl.indexOf('「')>=0)
            YIN.push({vol:v.vol,vid:v.id,les:v.title,cat:c.name,char:e.char,yin:ex.yin,clause:cl,cur:ex.cur});
        }
      });
    });
  })));
}

function fillVol(){volSel.innerHTML='<option value="ALL">全部冊別</option>'+allVols().map(v=>`<option value="${v}">${v}</option>`).join('');}

function curVols(){return DATA.filter(v=>(VOL==='ALL'||v.vol===VOL)&&(LES==='ALL'||v.id===LES));}

/* 釋義切欄：首欄(連詞性/編號)≤約13字，續欄≤13字；優先標點斷、不切在「」內 */
function splitRest(s,cells=[9,13,13,13,13]){
  const out=[];let str=s,idx=0;
  while(str.length>0){
    const cap=cells[Math.min(idx,cells.length-1)];
    if(str.length<=cap+1){out.push(str);break;}
    let bp=cap;
    for(let k=Math.min(cap+2,str.length);k>=Math.max(cap-2,1);k--){if(/[。、；，！？：]/.test(str[k-1])){bp=k;break;}}
    const head=str.slice(0,bp);
    if((head.split('「').length-1)>(head.split('」').length-1)){const nx=str.indexOf('」',bp);if(nx>=0)bp=nx+1;}
    while(bp<str.length&&/[ㄅ-ㄩˊˇˋ˙]/.test(str[bp])&&/[ㄅ-ㄩˊˇˋ˙]/.test(str[bp-1]))bp++;   // 不把一組注音(含聲調)切到兩欄
    out.push(str.slice(0,bp));str=str.slice(bp);idx++;
  }
  return out;
}
/* ---------- browse (直書) ---------- */
function entryCol(e){
  const cur=(e.ex||[]).some(x=>x.cur);
  const lines=(e.disp||[]).slice();
  // 多音字：後續行以注音開頭(換讀音)。標題只放國字，注音留在各讀音欄開頭→注音緊鄰其釋義、各讀音對齊
  const isPoly=lines.slice(1).some(ln=>/^[˙ㄅ-ㄯ]/.test(ln.trim()));
  // 詞語辨析(其他類)：含「A、B」小標題、開頭非單字定義 → 不顯示大標國字，小標題另排
  const isLabel=t=>/、/.test(t)&&t.length<=8&&!/[ㄅ-ㄯˊˇˋ〔［①②③④⑤⑥⑦⑧⑨⑩「]/.test(t);
  const isCompare=!isPoly && isLabel((lines[0]||'').trim());
  let h=`<div class="xcol ${cur?'cur':''}">`;
  if(!isCompare) h+=`<div class="xhead">${isPoly?ru(e.char,''):ru(e.char,e.yin)}</div>`;
  h+='<div class="xbody">';
  // 格狀對齊：每行 = 詞性(格1)＋編號(格2)＋釋義(格3起)。詞性缺→用「透明的同款詞性」佔位
  // (寬度完全相同→精準對齊)；編號缺→補全形空格。多音(注音開頭)與※註解維持原樣。
  let curPos="",curYin="";
  lines.forEach((ln,i)=>{
    let txt;
    if(i===0){ txt = isPoly ? ln.replace(/^[\s　]+/,'').slice([...e.char].length).replace(/^[\s　]+/,'') : isCompare ? ln.trim() : stripLead(ln,e.char); }
    else txt=ln.trim();
    if(!txt)return;
    if(isLabel(txt)){h+=`<div class="vline" style="color:var(--gold);font-weight:700">${decorate(txt)}</div>`;curPos="";curYin="";return;}
    txt=txt.replace(/（本課）|\(本課\)/g,'').trim();   // 本課已用紅字標示，內文不再顯示
    if(!txt)return;
    if(ln.indexOf('※')===0){
      // ※註解：前面放與釋義行等寬的隱形佔位→與左邊釋義齊頭；太長切成多欄，續欄同樣齊頭
      const nh=`<span class="nhead">${isPoly&&curYin?`<span class="yin">${esc(curYin)}</span>`:""}${curPos?decorate(curPos):"　　　"}　</span>`;
      splitRest(txt,[10]).forEach(c=>{h+=`<div class="vline note">${nh}${decorate(c)}</div>`;});
      return;
    }
    let yinTok="",posTok="",num="",rest=txt;
    if(isPoly){const ym=rest.match(/^([˙ㄅ-ㄯˊˇˋ]+)\s*/);if(ym){yinTok=ym[1];rest=rest.slice(ym[0].length);curYin=yinTok;}}
    const pm=rest.match(/^([〔［][^〕］]*[〕］])\s*/);
    if(pm){posTok=pm[1];rest=rest.slice(pm[0].length);curPos=posTok;}
    const nm=rest.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*/);
    if(nm){num=nm[1];rest=rest.slice(nm[0].length);}
    // 多音字：注音當最前一格，續欄用隱形注音佔位，使②③與①齊頭
    let yinHTML = !isPoly ? "" : yinTok ? `<span class="yin">${esc(yinTok)}</span>`
                : curYin ? `<span class="yin" style="visibility:hidden">${esc(curYin)}</span>` : "";
    let posHTML = posTok ? decorate(posTok)
                : curPos ? `<span style="visibility:hidden">${decorate(curPos)}</span>`
                : "　　　";
    const ck=splitRest(rest);   // 釋義太長→切成多欄，續欄接到右邊
    const head=`${yinHTML}${posHTML}${num||"　"}`;
    h+=`<div class="vline">${head}${decorate(ck[0])}</div>`;
    const hhead=`<span style="visibility:hidden">${head}</span>`;  // 等寬隱形佔位→續欄與釋義齊頭
    for(let k=1;k<ck.length;k++) h+=`<div class="vline">${hhead}${decorate(ck[k])}</div>`;
  });
  h+='</div></div>';
  return h;
}
/* 會考攻略：照原書畫成橫式表格（號｜形｜音｜詞語），註解編號接在詞後、表格下方列出 */
function guideTable(c){
  const G=c.groups;
  if(c.name==='常考詞語'){
    let h='<div class="card gcard"><table class="gtbl"><tr><th>字</th><th>音</th><th>詞語</th></tr>';
    G.forEach(g=>g.entries.forEach(e=>{
      const raw=(e.ex&&e.ex[0]&&e.ex[0].raw)||'';
      h+=`<tr><td class="ch">${esc(e.char)}</td><td class="yn">${vzhuyin(e.yin)}</td><td class="wd">${esc(raw).replace(/「([^」]*)」/g,'<span class="hl">$1</span>')}</td></tr>`;
    }));
    return h+'</table></div>';
  }
  if(!G.length||!G.every(g=>g.tbl))return '';
  const notes=[];
  const hlw=(w,ch)=>esc(w).split(esc(ch)).join(`<span class="hl">${esc(ch)}</span>`);
  const words=(ws,ch)=>ws.map(w=>{let s=hlw(w[0],ch);if(w[1]){notes.push([w[0],w[1]]);s+=`<span class="fn">${notes.length}</span>`;}return s;}).join('、');
  const chCell=(t,rs)=>`<td class="ch"${rs>1?` rowspan="${rs}"`:''}>${esc(t.ch)}</td>`;
  let h='<div class="card gcard"><table class="gtbl">';
  if(c.name==='形近字'){
    h+='<thead><tr><th>號</th><th>形</th><th>音</th><th>詞語</th></tr></thead>';
    G.forEach(g=>{const t=g.tbl,n=t.c.length;h+='<tbody class="grp">';
      t.c.forEach((x,i)=>{
        h+='<tr>';
        if(i===0)h+=`<td class="no" rowspan="${n}">${t.no}.</td>`;
        h+=chCell(x,1);
        if(i===0)h+=`<td class="yn" rowspan="${n}">${vzhuyin(t.y)}</td>`;
        h+=`<td class="wd">${words(x.w,x.ch)}</td></tr>`;
      });
      if(t.tip)h+=`<tr class="gtip"><td colspan="4">💡 記憶TIP：${esc(t.tip)}</td></tr>`;
      h+='</tbody>';
    });
  }else if(c.name==='一字多音'){
    h+='<thead><tr><th>形</th><th>音</th><th>釋義</th><th>詞語</th></tr></thead>';
    G.forEach(g=>{const t=g.tbl,n=t.r.reduce((a,r)=>a+r.s.length,0);let first=true;h+='<tbody class="grp">';
      t.r.forEach(r=>r.s.forEach((s,si)=>{
        h+='<tr>';
        if(first){h+=chCell(t,n);first=false;}
        if(si===0)h+=`<td class="yn"${r.s.length>1?` rowspan="${r.s.length}"`:''}>${vzhuyin(r.y)}</td>`;
        h+=`<td class="mn">${esc(s.m)}</td><td class="wd">${words(s.w,t.ch)}</td></tr>`;
      }));
      h+='</tbody>';
    });
  }else if(c.name==='一字多義'){
    h+='<thead><tr><th>形</th><th>釋義</th><th>詞語</th></tr></thead>';
    G.forEach(g=>{const t=g.tbl;h+='<tbody class="grp">';
      t.s.forEach((s,si)=>{h+='<tr>';if(si===0)h+=chCell(t,t.s.length);h+=`<td class="mn">${esc(s.m)}</td><td class="wd">${words(s.w,t.ch)}</td></tr>`;});
      h+='</tbody>';
    });
  }else return '';
  h+='</table>';
  if(notes.length)h+='<div class="gnotes">'+notes.map((x,i)=>`<div><span class="fn">${i+1}</span>${esc(x[0])}：${esc(x[1])}</div>`).join('')+'</div>';
  return h+'</div>';
}
function renderBrowse(){

/* ---------- quiz ---------- */
let Q=null,qStat={n:0,ok:0},QLEN=10,QSEQ=[],QI=0;
function pickPool(){
  const vf=(VOL==='ALL')?()=>true:x=>x.vol===VOL;
  const lf=(LES==='ALL')?()=>true:x=>x.vid===LES;
  const cf=(CAT==='ALL')?()=>true:x=>x.cat===CAT;
  return (TAB==='form'?FORM:TAB==='kao'?KAO:YIN).filter(x=>vf(x)&&lf(x)&&cf(x));
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* 注音相似度：同音(不同字)最高、同音不同調次之，再比聲母/韻母共用 → 誘答挑易混淆的讀音 */
function toneless(s){return (s||'').replace(/[ˊˇˋ˙]/g,'');}
function simYin(a,b){if(!a||!b)return 0;if(a===b)return 6;var ta=toneless(a),tb=toneless(b);if(ta===tb)return 5;var i=0;while(i<ta.length&&i<tb.length&&ta[i]===tb[i])i++;var j=0;while(j+i<ta.length&&j+i<tb.length&&ta[ta.length-1-j]===tb[tb.length-1-j])j++;return i+j+(ta[0]===tb[0]?0.5:0);}
function simYinPick(ans,all,n){var cand=[...new Set(all)].filter(y=>y&&y!==ans);var scored=cand.map(y=>({y:y,s:simYin(ans,y)})).sort((a,b)=>b.s-a.s);var top=scored.slice(0,Math.max(n+3,7)).map(o=>o.y);return shuffle(top).slice(0,n);}
function hprompt(s,mode){ // 橫式：'blank' 詞例挖空底線 ; 'mark' 「」標紅
  s=esc(s).replace(/([〔［][^〕］]*[〕］])/g,'<span class="pos">$1</span>');
  if(mode==='blank')s=s.replace(/（\s*　?\s*）/g,'<span class="hblank">＿</span>');
  s=s.replace(/「([^」]*)」/g,'「<span class="hl">$1</span>」');
  return s;
}
function makeQ(it){
  if(TAB==='form')return {kind:'form',it,ans:it.ans,opts:shuffle(it.opts)};
  if(TAB==='kao'){
    if(it.gen==='yin'){ /* 讀音題：同字其他讀音＋相似讀音補滿四選一 */
      const alts=(it.alts||[]).filter(y=>y&&y!==it.yin);
      const need=Math.max(0,3-alts.length);
      const ds=alts.slice(0,3).concat(simYinPick(it.yin,[...ALLYIN].filter(y=>alts.indexOf(y)<0),need));
      const opts=shuffle([it.yin,...ds]);
      return {kind:'kao',it,opts,ans:String(opts.indexOf(it.yin))};
    }
    return {kind:'kao',it,opts:it.opts,ans:String(it.ans)};
  }
  const ds=simYinPick(it.yin,ALLYIN,3);
  return {kind:'yin',it,ans:it.yin,opts:shuffle([it.yin,...ds])};
}
function startRound(){
  const pool=pickPool();
  if(!pool.length){app.innerHTML='<div class="empty">'+(TAB==='kao'?'會考題收錄於「會考攻略」冊別，請將冊別切到「會考攻略」或「全部冊別」。':'此範圍沒有可出題的資料，請換冊別／課次／類別。')+'</div>';return;}
  QSEQ=shuffle(pool); if(QLEN>0)QSEQ=QSEQ.slice(0,QLEN);
  QI=0;qStat={n:0,ok:0};ROUND=null;showQ();
}
function showQ(){ if(QI>=QSEQ.length){renderDone();return;} Q=makeQ(QSEQ[QI]);renderQ(); }
function lenBar(){return `<div class="qlen">題數　`+[['10','10 題'],['20','20 題'],['0','全部']].map(p=>`<button class="lenbtn ${String(QLEN)===p[0]?'on':''}" data-len="${p[0]}">${p[1]}</button>`).join('')+`</div>`;}
function bindLen(){document.querySelectorAll('.lenbtn').forEach(b=>b.onclick=()=>{QLEN=parseInt(b.dataset.len);startRound();});}
function renderQ(){
  const it=Q.it;let stage,hint,opts;
  if(Q.kind==='kao'){
    stage=`<div class="qprompt kaoq">${hprompt(it.q,'mark').replace(/&lt;br\s*\/?(&gt;|>)/g,'<br>')}</div>`;
    hint=`<div class="qhint">${esc(it.src)}　·　${esc(it.cat)}</div>`;
    opts=Q.opts.map((o,i)=>`<div class="opt kaoopt" data-o="${i}"><span class="kl">(${'ABCD'[i]})</span><span>${hprompt(o,'mark')}</span></div>`).join('');
  }else if(Q.kind==='form'){
    stage=`<div class="qprompt">${hprompt(it.clause,'blank')}</div>`;
    hint=`<div class="qhint">${it.cat}　·　＿ 該填哪個形近字？</div>`;
    opts=Q.opts.map(o=>`<div class="opt" data-o="${esc(o)}"><span class="rb">${esc(o)}</span></div>`).join('');
  }else{
    stage=`<div class="qprompt">${hprompt(it.clause,'mark')}</div>`;
    hint=`<div class="qhint">「<b>${esc(it.char)}</b>」在此念什麼音？</div>`;
    opts=Q.opts.map(o=>`<div class="opt yinopt" data-o="${esc(o)}"><span class="yinh">${esc(o)}</span></div>`).join('');
  }
  app.innerHTML=`<div class="qbox">
    ${lenBar()}
    <div class="qmeta"><span>${it.les}</span><span>第 ${QI+1} / ${QSEQ.length} 題</span></div>
    <div class="qstage">${stage}</div>${hint}
    <div class="opts${Q.kind==='kao'?' kaoopts':''}" id="opts">${opts}</div>
    <div class="fb" id="fb"></div></div>
    <div class="score">本回合 答對 <b>${qStat.ok}</b> ／ 作答 <b>${qStat.n}</b></div>`;
  document.querySelectorAll('#opts .opt').forEach(el=>el.onclick=()=>answer(el));
  bindLen();
}
function answer(el){
  if(el.classList.contains('done'))return;
  const chosen=el.dataset.o,correct=String(Q.ans);
  document.querySelectorAll('#opts .opt').forEach(x=>{x.classList.add('done');
    if(x.dataset.o===correct)x.classList.add('ok');else if(x===el)x.classList.add('bad');else x.classList.add('dim');x.onclick=null;});
  qStat.n++;const good=chosen===correct;if(good)qStat.ok++;
  const fb=$('#fb');fb.className='fb show '+(good?'good':'no');const it=Q.it;
  if(Q.kind==='kao'){
    const L=i=>'('+'ABCD'[i]+') '+Q.opts[i];
    fb.innerHTML=(good?'✓ 答對了！':`✗ 正解：<b>${esc(L(+correct))}</b>`)+(it.exp?`<div class="ex">${esc(it.exp)}</div>`:'');
    if(!good)logWrong(L(+chosen),L(+correct));
  }else if(Q.kind==='form'){
    fb.innerHTML=(good?'✓ 答對了！':`✗ 正解：<b>${esc(correct)}</b>`)+`<div class="ex">${esc(it.clause).replace(/（\s*　?\s*）/,'「<span class="hl">'+esc(correct)+'</span>」')}</div>`;
  }else{
    fb.innerHTML=(good?'✓ 答對了！':`✗ 正解：<b>${esc(correct)}</b>`)+`<div class="ex">「${esc(it.char)}」　${esc(correct)}</div>`;
  }
  if(!good&&Q.kind!=='kao')logWrong(chosen,correct);
  const last=(QI+1>=QSEQ.length);
  const nb=document.createElement('button');nb.className='next';nb.textContent=last?'看結果 ✦':'下一題 ▶';nb.onclick=()=>{QI++;showQ();};$('.qbox').appendChild(nb);
  $('.score').innerHTML=`本回合 答對 <b>${qStat.ok}</b> ／ 作答 <b>${qStat.n}</b>`;
}
function renderDone(){
  const pct=qStat.n?Math.round(qStat.ok/qStat.n*100):0;
  app.innerHTML=`<div class="qbox" style="text-align:center">
    ${lenBar()}
    <div style="font-size:42px;margin:6px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
    <div style="font-size:20px;color:var(--brand);font-weight:700">本回合完成！</div>
    <div style="font-size:17px;margin:10px 0">答對 <b style="color:var(--ok)">${qStat.ok}</b> ／ ${qStat.n} 題　·　正確率 <b>${pct}%</b></div>
    <button class="next" id="again">再來一回 ↻</button></div>`;
  $('#again').onclick=startRound;bindLen();
}

window.acctLogin=async()=>{const e=$('#aem').value.trim(),p=$('#apw').value;if(!e||!p)return acctMsg('請輸入 Email 與密碼','bad');acctMsg('登入中…');try{await doSignIn(e,p);await syncDown();renderWrong();}catch(x){acctMsg('登入失敗：'+x.message,'bad')}};
window.acctReg=async()=>{const e=$('#aem').value.trim(),p=$('#apw').value;if(!e||p.length<6)return acctMsg('請輸入 Email，密碼至少 6 碼','bad');acctMsg('註冊中…');try{await doSignUp(e,p);if(loggedIn()){await syncDown();renderWrong();}else acctMsg('已送出註冊，請到信箱完成驗證後再登入','ok');}catch(x){acctMsg('註冊失敗：'+x.message,'bad')}};
window.acctLogout=()=>{saveSession(null);renderWrong();};
window.acctSync=async()=>{acctMsg('');await syncDown();renderWrong();};

/* ---------- 錯題本 ---------- */
const MKEY='xyy_mistakes_v1';let ROUND=null,CANP=true,MEM=[];
function loadM(){try{return JSON.parse(localStorage.getItem(MKEY)||'[]')}catch(e){CANP=false;return MEM}}
function saveM(a){if(CANP){try{localStorage.setItem(MKEY,JSON.stringify(a));return}catch(e){CANP=false}}MEM=a;}
function logWrong(you,correct){if(!ROUND)ROUND='R'+Date.now();const it=Q.it;const a=loadM();
  a.push({round:ROUND,t:new Date().toISOString(),tab:TAB,les:it.les,cat:it.cat,
    prompt:(Q.kind==='kao'?String(it.q).replace(/<br>/g,' '):Q.kind==='form'?it.clause:('「'+it.char+'」念？')),correct:String(correct),you:String(you)});saveM(a);cloudMirror();}
function renderWrong(){
  const acct=acctHTML();
  const a=loadM();
  const tools=`<div class="mtools"><button class="btn" onclick="expM()">⬇ 匯出備份</button>
    <label class="btn">⬆ 匯入<input type="file" id="impf" accept="application/json" style="display:none"></label>
    <button class="btn danger" onclick="clrM()">🗑 清空</button></div>`;
  if(!a.length){app.innerHTML=acct+tools+'<div class="empty">目前沒有錯題　🎉<br>測驗答錯時會自動記錄在這裡。</div>';bindImp();return;}
  const r={};a.forEach(x=>{(r[x.round]=r[x.round]||[]).push(x)});
  let h=acct+tools;Object.keys(r).sort().reverse().forEach(k=>{const rs=r[k];const t=new Date(rs[0].t);
    const ts=`${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    h+=`<div class="mround"><h4>🕓 ${ts}　共 ${rs.length} 題　<span class="tag">${rs[0].tab==='form'?'形近字':rs[0].tab==='kao'?'會考題':'注音'}</span></h4>`;
    rs.forEach(x=>{h+=`<div class="mitem"><span class="tag">${x.les.split('　')[0]}</span>${esc(x.prompt)}<br>正解 <span class="right">${esc(x.correct)}</span>　你選 <span class="wrong">${esc(x.you)}</span></div>`;});
    h+='</div>';});
  app.innerHTML=h;bindImp();
}
function bindImp(){const f=$('#impf');if(f)f.onchange=e=>{const fr=new FileReader();fr.onload=()=>{try{
  const inc=JSON.parse(fr.result);const cur=loadM();const seen=new Set(cur.map(r=>r.round+r.t+r.prompt+r.you));
  inc.forEach(r=>{const kk=r.round+r.t+r.prompt+r.you;if(!seen.has(kk)){cur.push(r);seen.add(kk)}});
  saveM(cur);cloudMirror();renderWrong();alert('匯入完成');}catch(x){alert('檔案格式錯誤')}};fr.readAsText(e.target.files[0]);};}
function expM(){const b=new Blob([JSON.stringify(loadM(),null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='形音義_錯題本.json';a.click();URL.revokeObjectURL(u);}
function clrM(){if(confirm('確定清空所有錯題紀錄？'+(CLOUD&&loggedIn()?'（雲端紀錄也會一併清空）':''))){saveM([]);cloudMirror();renderWrong();}}
window.expM=expM;window.clrM=clrM;

/* ---------- routing ---------- */
function render(){
  volSel.style.display=catSel.style.display=lesSel.style.display=(TAB==='wrong')?'none':'';
  if(TAB==='browse')renderBrowse();
  else if(TAB==='wrong')renderWrong();
  else{startRound();}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');TAB=t.dataset.t;window.scrollTo(0,0);render();});
volSel.onchange=()=>{VOL=volSel.value;LES='ALL';fillLes();render()};
lesSel.onchange=()=>{LES=lesSel.value;render()};
catSel.onchange=()=>{CAT=catSel.value;render()};
buildPools();fillVol();fillLes();fillCat();loadSession();render();
if(CLOUD&&loggedIn())syncDown().then(()=>{if(TAB==='wrong')renderWrong();});
</script>
</body>
</html>
